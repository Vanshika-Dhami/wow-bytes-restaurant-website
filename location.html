<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Location | Wow Bytes</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
        url('backg.jpeg');
      background-size: cover;
      background-position: center;
      min-height: 100vh;
    }

    /* TOP BAR */
    .top-bar {
      position: absolute;
      top: 20px;
      right: 30px;
    }

    .top-bar a {
      text-decoration: none;
      background: #ff9800;
      color: #000;
      padding: 10px 22px;
      border-radius: 30px;
      font-weight: 600;
    }

    /* LOCATION SECTION */
    .location-container {
      max-width: 1100px;
      margin: auto;
      padding: 120px 20px 40px;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1.2rem;
      color: #ddd;
      margin-bottom: 40px;
    }

    .location-box {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
    }

    /* MAP */
    .map {
      flex: 1;
      min-width: 300px;
      height: 350px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    .map iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* INFO */
    .location-info {
      flex: 1;
      min-width: 280px;
      background: rgba(0,0,0,0.6);
      padding: 30px;
      border-radius: 15px;
      text-align: left;
    }

    .location-info h3 {
      color: #ff9800;
      margin-bottom: 15px;
    }

    .location-info p {
      margin: 10px 0;
      font-size: 1.05rem;
    }

    footer {
      margin-top: 40px;
      color: #ccc;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <a href="index.html">Home</a>
  </div>

  <!-- LOCATION -->
  <div class="location-container">
    <h1>OUR LOCATION</h1>
    <p class="subtitle">Find us easily and enjoy the WOW BYTES experience 📍</p>

    <div class="location-box">
      <!-- MAP -->
      <div class="map">
        <!-- Replace location if needed -->
        <iframe 
          src="https://www.google.com/maps?q=New%20Delhi%20India&output=embed">
        </iframe>
      </div>

      <!-- INFO -->
      <div class="location-info">
        <h3>📍 Address</h3>
        <p>Wow Bytes – Fusion Restaurant</p>
        <p>Main Road, City Name</p>
        <p>India</p>

        <h3>⏰ Opening Hours</h3>
        <p>Monday – Sunday</p>
        <p>11:00 AM – 11:00 PM</p>

        <h3>🚗 Parking</h3>
        <p>Free parking available</p>

        <h3>📞 Contact</h3>
        <p>+91 98765 43210</p>
      </div>
    </div>

    <footer>
      © 2026 WOW BYTES | Taste the Fusion
    </footer>
  </div>

</body>
</html>
