<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | Wow Bytes</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
        url('backg.jpeg');
      background-size: cover;
      background-position: center;
      min-height: 100vh;
    }

    /* TOP BAR */
    .top-bar {
      position: absolute;
      top: 20px;
      right: 30px;
    }

    .top-bar a {
      text-decoration: none;
      background: #ff9800;
      color: #000;
      padding: 10px 22px;
      border-radius: 30px;
      font-weight: 600;
    }

    /* CONTACT SECTION */
    .contact-container {
      max-width: 1100px;
      margin: auto;
      padding: 120px 20px 40px;
    }

    h1 {
      text-align: center;
      font-size: 3rem;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      font-size: 1.2rem;
      margin-bottom: 50px;
      color: #ddd;
    }

    .contact-box {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
    }

    /* LEFT INFO */
    .contact-info {
      flex: 1;
      min-width: 280px;
    }

    .contact-info h3 {
      color: #ff9800;
      margin-bottom: 15px;
    }

    .contact-info p {
      margin: 10px 0;
      font-size: 1.05rem;
    }

    /* FORM */
    .contact-form {
      flex: 1;
      min-width: 280px;
      background: rgba(0,0,0,0.6);
      padding: 30px;
      border-radius: 12px;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
    }

    .contact-form textarea {
      resize: none;
      height: 120px;
    }

    .contact-form button {
      width: 100%;
      padding: 14px;
      border-radius: 40px;
      border: none;
      background: #ff9800;
      color: #000;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .contact-form button:hover {
      background: #ffc107;
      transform: scale(1.05);
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: #ccc;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <a href="index.html">Home</a>
  </div>

  <!-- CONTACT -->
  <div class="contact-container">
    <h1>CONTACT US</h1>
    <p class="subtitle">Have a question or want to book a table? Let’s talk 🍽️</p>

    <div class="contact-box">
      <!-- INFO -->
      <div class="contact-info">
        <h3>📍 Address</h3>
        <p>Wow Bytes – Fusion Restaurant</p>
        <p>Main Road, City Name, India</p>

        <h3>📞 Phone</h3>
        <p>+91 98765 43210</p>

        <h3>📧 Email</h3>
        <p>wowbytes@gmail.com</p>

        <h3>⏰ Opening Hours</h3>
        <p>Mon – Sun: 11:00 AM – 11:00 PM</p>
      </div>

      <!-- FORM -->
      <div class="contact-form">
        <form>
          <input type="text" placeholder="Your Name" required />
          <input type="email" placeholder="Your Email" required />
          <input type="text" placeholder="Subject" />
          <textarea placeholder="Your Message" required></textarea>
          <button type="submit">Send Message</button>
        </form>
      </div>
    </div>

    <footer>
      © 2026 WOW BYTES | Taste the Fusion
    </footer>
  </div>

</body>
</html>
