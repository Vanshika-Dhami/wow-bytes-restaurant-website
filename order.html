<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order | Wow Bytes</title>
<style>
  body { font-family:'Segoe UI',sans-serif; background:#111; color:#fff; margin:0; padding:0; }
  h1 { text-align:center; color:#ff9800; margin:20px 0; }

  /* Split container */
  .container {
    display: flex;
    height: calc(100vh - 80px); /* full screen minus header */
    gap: 20px;
    padding: 20px;
  }

  /* Menu */
  .menu {
    flex: 2;
    background:#1a1a1a;
    border-radius: 15px;
    padding: 15px;
    overflow-y:auto; /* scrollable */
  }

  .menu h2 { color:#ff9800; margin-bottom:15px; }

  .menu-grid {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap:15px;
  }

  .menu-item {
    background:#fafafa;
    color:#000;
    border-radius:12px;
    padding:10px;
    text-align:center;
    font-size:0.9rem;
  }

  .menu-item img { width:100%; height:100px; object-fit:cover; border-radius:10px; }
  .menu-item button { margin:5px 0; padding:6px 12px; border:none; border-radius:30px; background:#ff9800; font-weight:600; cursor:pointer; font-size:0.8rem; }
  .menu-item button:hover { background:#ffc107; }

  /* Cart */
  .cart {
    flex:1;
    background:#1a1a1a;
    border-radius:15px;
    padding:15px;
    overflow-y:auto;
  }

  .cart h2 { color:#ff9800; margin-bottom:15px; }

  table { width:100%; border-collapse:collapse; margin:10px 0; font-size:0.9rem; }
  th, td { border:1px solid #444; padding:6px; text-align:left; }
  th { background:#222; }
  tr:nth-child(even) { background:#111; }

  input[type=number] { width:40px; padding:3px; border-radius:4px; border:none; font-size:0.9rem; }

  input, textarea, button { width:100%; margin:5px 0; padding:8px; border-radius:5px; border:none; font-size:0.9rem; }
  button.submit-btn { background:#ff9800; color:#000; font-weight:600; cursor:pointer; }
  button.submit-btn:hover { background:#ffc107; }

  /* Responsive for mobile */
  @media (max-width:768px){
    .container { flex-direction: column; height:auto; }
    .menu, .cart { flex:unset; max-height:none; }
  }

</style>
</head>
<body>

<h1>Order Your Favorite Dish 🍽️</h1>

<div class="container">
  <!-- Menu -->
  <div class="menu">
    <h2>Menu</h2>
    <div class="menu-grid">
      <div class="menu-item">
        <img src="chilli-paneer.jpeg" alt="Chilli Paneer">
        <h3>Chilli Paneer</h3>
        <p>₹220</p>
        <button onclick="addToCart('Chilli Paneer',220)">Add</button>
      </div>

      <div class="menu-item">
        <img src="hakka-noodles.jpeg" alt="Hakka Noodles">
        <h3>Hakka Noodles</h3>
        <p>₹180</p>
        <button onclick="addToCart('Hakka Noodles',180)">Add</button>
      </div>

      <div class="menu-item">
        <img src="fried-rice.jpeg" alt="Veg Fried Rice">
        <h3>Veg Fried Rice</h3>
        <p>₹160</p>
        <button onclick="addToCart('Veg Fried Rice',160)">Add</button>
      </div>

      <div class="menu-item">
        <img src="butter-chicken.jpeg" alt="Butter Chicken">
        <h3>Butter Chicken</h3>
        <p>₹320</p>
        <button onclick="addToCart('Butter Chicken',320)">Add</button>
      </div>

      <div class="menu-item">
        <img src="spring-roll.jpeg" alt="Spring Rolls">
        <h3>Spring Rolls</h3>
        <p>₹150</p>
        <button onclick="addToCart('Spring Rolls',150)">Add</button>
      </div>

      <div class="menu-item">
        <img src="manchurian.jpeg" alt="Veg Manchurian">
        <h3>Veg Manchurian</h3>
        <p>₹200</p>
        <button onclick="addToCart('Veg Manchurian',200)">Add</button>
      </div>
    </div>
  </div>

  <!-- Cart -->
  <div class="cart">
    <h2>Your Cart</h2>
    <table id="cart-table">
      <tr>
        <th>Item</th>
        <th>Price</th>
        <th>Qty</th>
        <th>Subtotal</th>
        <th>Action</th>
      </tr>
    </table>
    <p id="total" style="text-align:right; font-weight:bold; color:#ff9800; font-size:1rem;"></p>

  
      <!-- Hidden fields -->
      <input type="hidden" name="food_item" id="food_item">
      <input type="hidden" name="quantity" id="quantity">
      <input type="hidden" name="total_price" id="total_price">

      <button type="submit" class="submit-btn">Place Order</button>
    </form>
  </div>
</div>

<script>
let cart = [];

function addToCart(name, price){
  let existing = cart.find(i => i.name === name);
  if(existing){
    existing.qty += 1;
  } else {
    cart.push({name, price, qty:1});
  }
  renderCart();
}

function renderCart(){
  const table = document.getElementById("cart-table");
  table.innerHTML = `
    <tr>
      <th>Item</th>
      <th>Price</th>
      <th>Qty</th>
      <th>Subtotal</th>
      <th>Action</th>
    </tr>`;
  let total = 0;
  cart.forEach((item,index)=>{
    let row = table.insertRow();
    row.insertCell(0).textContent = item.name;
    row.insertCell(1).textContent = "₹"+item.price;

    let qtyCell = row.insertCell(2);
    let input = document.createElement("input");
    input.type="number"; input.min=1; input.value=item.qty;
    input.onchange = ()=>{ item.qty=parseInt(input.value); renderCart(); };
    qtyCell.appendChild(input);

    row.insertCell(3).textContent = "₹"+(item.price*item.qty);

    let actionCell = row.insertCell(4);
    let btn = document.createElement("button");
    btn.textContent = "Remove";
    btn.onclick = ()=>{ cart.splice(index,1); renderCart(); };
    actionCell.appendChild(btn);

    total += item.price*item.qty;
  });
  document.getElementById("total").textContent = "Total: ₹"+total;
}

function prepareOrder(){
  if(cart.length===0){
    alert("Cart is empty!");
    return false;
  }
  document.getElementById("food_item").value = cart.map(i=>i.name).join(", ");
  document.getElementById("quantity").value = cart.reduce((sum,i)=>sum+i.qty,0);
  document.getElementById("total_price").value = cart.reduce((sum,i)=>sum+i.price*i.qty,0);
  return true;
}
</script>

</body>
</html>
