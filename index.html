<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wow Bytes | Fusion Restaurant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
    }

    /* TOP BAR */
    .top-bar {
      position: absolute;
      top: 20px;
      right: 30px;
      z-index: 10;
    }

    .top-bar a {
      text-decoration: none;
      background: #ff9800;
      color: #000;
      padding: 10px 22px;
      border-radius: 30px;
      font-weight: 600;
      transition: 0.25s ease;
    }

    .top-bar a:hover {
      background: #ffc107;
      transform: scale(1.05);
    }

    /* HOME PAGE */
    .hero {
      min-height: 100vh;
      background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)),
        url('backg.jpeg');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .hero h1 {
      font-size: 4rem;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 1.4rem;
      max-width: 750px;
      margin-bottom: 50px;
    }

    /* BUTTONS */
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      justify-content: center;
    }

    .btn {
      padding: 15px 32px;
      border-radius: 40px;
      border: none;
      background: #ff9800;
      color: #000;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.05);
      background: #ffc107;
    }
  </style>
</head>

<body>

  <!-- LOGIN / SIGN UP -->
  <div class="top-bar">
    <a href="login.html">Login / Sign Up</a>
  </div>

  <!-- HOME PAGE -->
  <div class="hero">
    <h1>WOW BYTES</h1>
    <p>
      A mouth-watering fusion plate of Chinese & Indian cuisine — bold spices, rich flavors, one unforgettable bite 🍜🍛
    </p>

    <div class="buttons">
      <a href="menu.html" class="btn">Menu</a>
      <a href="order.html" class="btn">Order</a>
      <a href="interior.html" class="btn">Book Seat</a>
      <a href="contact.html" class="btn">Contact</a>
      <a href="location.html" class="btn">Location</a>
    </div>
  </div>

</body>

</html>
