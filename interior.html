<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interior | Wow Bytes</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #111;
      color: #fff;
    }

    h1 {
      text-align: center;
      color: #ff9800;
      margin: 40px 0;
      font-size: 3rem;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto 50px;
      padding: 0 20px;
    }

    .gallery-item {
      text-align: center;
    }

    .gallery-item img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.5);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .gallery-item img:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }

    .floor-name {
      margin-top: 10px;
      font-weight: bold;
      font-size: 1.1rem;
      color: #ff9800;
    }

    .btn-book {
      display: block;
      margin: 30px auto;
      padding: 15px 40px;
      background: #ff9800;
      color: #000;
      font-weight: 600;
      font-size: 1.2rem;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
      text-align: center;
    }

    .btn-book:hover {
      background: #ffc107;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

<h1>Our Restaurant Interior 🍽️</h1>

<div class="gallery">
  <div class="gallery-item">
    <img src="interior1.jpeg" alt="Interior Ground Floor">
    <div class="floor-name">Ground Floor</div>
  </div>

  <div class="gallery-item">
    <img src="interior2.jpeg" alt="Interior First Floor">
    <div class="floor-name">First Floor</div>
  </div>

  <div class="gallery-item">
    <img src="interior3.jpeg" alt="Interior Balcony">
    <div class="floor-name">Second Floor</div>
  </div>

  <div class="gallery-item">
    <img src="interior4.jpeg" alt="Interior VIP Lounge">
    <div class="floor-name">Rooftop</div>
  </div>

</div>

<!-- Book Seats button -->
<a href="bookseat.html" class="btn-book">Book Your Seats Now</a>

</body>
</html>
